[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-retrieval"
version = "0.1.0"
description = "AIC 2026 video retrieval contracts and dataset audit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
clip = ["torch>=2.1", "transformers>=4.40"]
multilingual = ["torch>=2.1", "sentence-transformers>=5.0"]
video = ["opencv-python-headless>=4.8"]

[project.scripts]
aic-audit-dataset = "aic_retrieval.data:main"

[tool.setuptools.packages.find]
where = ["src"]
